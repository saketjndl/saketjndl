<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Saket Jindal</title>
<desc id="desc">Colorful animated abstract profile banner with floating gradient shapes and playful geometric accents.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10152d"/><stop offset=".48" stop-color="#20214a"/><stop offset="1" stop-color="#351d50"/></linearGradient>
  <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55d6ff"/><stop offset=".34" stop-color="#8b7cff"/><stop offset=".68" stop-color="#ff75b5"/><stop offset="1" stop-color="#ffb86b"/></linearGradient>
  <radialGradient id="cyan"><stop stop-color="#37d8ff" stop-opacity=".8"/><stop offset="1" stop-color="#37d8ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="pink"><stop stop-color="#ff65b5" stop-opacity=".65"/><stop offset="1" stop-color="#ff65b5" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".12"/></pattern>
  <clipPath id="clip"><rect width="1200" height="340" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <g filter="url(#blur)">
    <ellipse cx="950" cy="80" rx="260" ry="170" fill="url(#cyan)"><animate attributeName="cx" values="950;800;950" dur="17s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="1080" cy="285" rx="280" ry="170" fill="url(#pink)"><animate attributeName="cy" values="285;190;285" dur="19s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="240" cy="330" rx="220" ry="110" fill="url(#pink)" opacity=".6"><animate attributeName="cx" values="240;350;240" dur="23s" repeatCount="indefinite"/></ellipse>
  </g>
  <g opacity=".92">
    <circle cx="900" cy="85" r="42" fill="none" stroke="#55d6ff" stroke-width="2" stroke-opacity=".65"><animate attributeName="cy" values="85;68;85" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="210" r="68" fill="none" stroke="#ff75b5" stroke-width="2" stroke-opacity=".55" stroke-dasharray="7 10"><animateTransform attributeName="transform" type="rotate" from="0 1080 210" to="360 1080 210" dur="34s" repeatCount="indefinite"/></circle>
    <rect x="980" y="55" width="22" height="22" rx="6" fill="#ffb86b" transform="rotate(22 991 66)"><animateTransform attributeName="transform" type="rotate" values="22 991 66;202 991 66;22 991 66" dur="12s" repeatCount="indefinite"/></rect>
    <path d="M790 260l12-28 12 28 28 12-28 12-12 28-12-28-28-12z" fill="#9b8cff" opacity=".9"><animate attributeName="opacity" values=".45;1;.45" dur="4s" repeatCount="indefinite"/></path>
    <circle cx="1145" cy="78" r="5" fill="#ffb86b"><animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="285" r="4" fill="#55d6ff"><animate attributeName="r" values="2;5;2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="300" r="5" fill="#ff75b5"><animate attributeName="opacity" values=".3;1;.3" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M0 285 C180 235 240 340 420 285 S700 230 820 270" fill="none" stroke="url(#rainbow)" stroke-width="2" stroke-opacity=".55"/>
  <rect x="72" y="68" width="5" height="205" rx="2.5" fill="url(#rainbow)"/>
  <text x="108" y="151" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="64" font-weight="750" letter-spacing="-2.4">Saket Jindal</text>
  <text x="112" y="197" fill="#c8d4ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" letter-spacing="2.5">AI SECURITY  ·  MACHINE LEARNING  ·  SOFTWARE</text>
  <path d="M112 224H360" stroke="url(#rainbow)" stroke-width="3" stroke-linecap="round"/>
  <text x="112" y="261" fill="#aebcda" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Building and researching useful things.</text>
  <g transform="translate(690 95)">
    <circle r="3" fill="#fff"><animate attributeName="opacity" values=".1;1;.1" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>
</g>
</svg>