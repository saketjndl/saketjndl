<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Saket Jindal | AI Security Engineer</title>
<desc id="desc">Animated navy hero with drifting blue and violet light fields, orbital rings and subtle particles.</desc>
<defs>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset=".52" stop-color="#0a1930"/><stop offset="1" stop-color="#100f2b"/></linearGradient>
<radialGradient id="blue"><stop stop-color="#168bff" stop-opacity=".62"/><stop offset=".48" stop-color="#0a66c2" stop-opacity=".24"/><stop offset="1" stop-color="#0a66c2" stop-opacity="0"/></radialGradient>
<radialGradient id="violet"><stop stop-color="#9b6cff" stop-opacity=".48"/><stop offset=".5" stop-color="#7144a3" stop-opacity=".2"/><stop offset="1" stop-color="#7144a3" stop-opacity="0"/></radialGradient>
<linearGradient id="stroke"><stop stop-color="#62b5ff" stop-opacity=".05"/><stop offset=".48" stop-color="#62b5ff" stop-opacity=".52"/><stop offset="1" stop-color="#b18aff" stop-opacity=".42"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="48"/></filter>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#8bbcff" stroke-opacity=".055"/></pattern>
<clipPath id="clip"><rect width="1200" height="390" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1200" height="390" fill="url(#base)"/><rect width="1200" height="390" fill="url(#grid)"/>
<g filter="url(#blur)">
<ellipse cx="210" cy="90" rx="270" ry="180" fill="url(#blue)"><animate attributeName="cx" values="210;340;210" dur="18s" repeatCount="indefinite"/><animate attributeName="cy" values="90;210;90" dur="22s" repeatCount="indefinite"/></ellipse>
<ellipse cx="1010" cy="280" rx="310" ry="210" fill="url(#violet)"><animate attributeName="cx" values="1010;860;1010" dur="21s" repeatCount="indefinite"/><animate attributeName="cy" values="280;160;280" dur="19s" repeatCount="indefinite"/></ellipse>
<ellipse cx="620" cy="-30" rx="230" ry="130" fill="url(#blue)" opacity=".45"><animate attributeName="cx" values="620;760;620" dur="25s" repeatCount="indefinite"/></ellipse>
</g>
<g fill="none" stroke="url(#stroke)" transform="translate(860 190)">
<ellipse rx="275" ry="112" stroke-width="1.2" transform="rotate(-23)"><animateTransform attributeName="transform" type="rotate" from="-23" to="337" dur="75s" repeatCount="indefinite"/></ellipse>
<ellipse rx="220" ry="82" stroke-width="1" transform="rotate(34)" opacity=".75"><animateTransform attributeName="transform" type="rotate" from="34" to="-326" dur="95s" repeatCount="indefinite"/></ellipse>
<ellipse rx="310" ry="145" stroke-width=".8" transform="rotate(68)" opacity=".42"><animateTransform attributeName="transform" type="rotate" from="68" to="428" dur="120s" repeatCount="indefinite"/></ellipse>
</g>
<g fill="#8cc8ff">
<circle cx="1090" cy="90" r="3.5"><animate attributeName="opacity" values=".25;1;.25" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="1010" cy="315" r="2.5"><animate attributeName="opacity" values="1;.2;1" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="760" cy="48" r="2"><animate attributeName="opacity" values=".2;.9;.2" dur="3.7s" repeatCount="indefinite"/></circle>
<circle cx="1140" cy="230" r="2.5"><animate attributeName="opacity" values=".15;.8;.15" dur="4.6s" repeatCount="indefinite"/></circle>
<circle cx="680" cy="330" r="1.8"><animate attributeName="opacity" values=".8;.2;.8" dur="5.2s" repeatCount="indefinite"/></circle>
</g>
<path d="M0 310 C180 250 230 390 430 330 S760 230 930 290 S1090 350 1200 270" fill="none" stroke="#7bbcff" stroke-opacity=".14" stroke-width="1.2"><animate attributeName="d" dur="16s" repeatCount="indefinite" values="M0 310 C180 250 230 390 430 330 S760 230 930 290 S1090 350 1200 270;M0 280 C180 350 230 250 430 300 S760 350 930 250 S1090 260 1200 310;M0 310 C180 250 230 390 430 330 S760 230 930 290 S1090 350 1200 270"/></path>
<rect x="64" y="65" width="3" height="258" rx="2" fill="#52a8ff" opacity=".9"/>
<text x="94" y="160" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="700" letter-spacing="-2">Saket Jindal</text>
<text x="98" y="207" fill="#a9c8ed" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" letter-spacing="3.2">AI SECURITY ENGINEER</text>
<path d="M98 235H370" stroke="#4d9ff2" stroke-width="2" stroke-linecap="round" opacity=".8"/>
<text x="98" y="270" fill="#d2def0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" letter-spacing=".35">Automated purple teaming · Adversarial ML · Secure AI systems</text>
<text x="98" y="330" fill="#83a9d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2.8">RESEARCH / ENGINEERING / SECURITY</text>
<g transform="translate(1090 330)" opacity=".7"><circle r="19" fill="none" stroke="#7dbbff" stroke-opacity=".45"/><circle r="5" fill="#83c4ff"><animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite"/></circle><circle r="28" fill="none" stroke="#9c7aff" stroke-opacity=".25" stroke-dasharray="2 7"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/></circle></g>
</g></svg>