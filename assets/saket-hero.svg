<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Saket Jindal</title>
<desc id="desc">Bold, playful game-inspired profile banner with large centered name, electric blue and vivid green graphics, animated scan bars and geometric elements.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#17243a"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffffff"/><stop offset=".55" stop-color="#eaf3ff"/><stop offset="1" stop-color="#b9f6ca"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8fb5e8" stroke-opacity=".08"/></pattern>
  <clipPath id="clip"><rect width="1200" height="360" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1200" height="360" fill="url(#bg)"/>
<rect width="1200" height="360" fill="url(#grid)"/>
<!-- bold corner panels -->
<path d="M0 0H310L245 18H18V112L0 132Z" fill="#2563eb"/>
<path d="M1200 360H890L955 342H1182V248L1200 228Z" fill="#22c55e"/>
<path d="M0 260L92 260L118 286L118 360H0Z" fill="#1d4ed8" opacity=".9"/>
<path d="M1200 0H1110L1082 28V92H1200Z" fill="#f59e0b"/>
<!-- animated HUD arcs -->
<g fill="none" stroke-width="3">
  <circle cx="170" cy="180" r="78" stroke="#22c55e" stroke-dasharray="34 18 5 18" opacity=".9"><animateTransform attributeName="transform" type="rotate" from="0 170 180" to="360 170 180" dur="24s" repeatCount="indefinite"/></circle>
  <circle cx="1030" cy="180" r="78" stroke="#2563eb" stroke-dasharray="34 18 5 18" opacity=".95"><animateTransform attributeName="transform" type="rotate" from="360 1030 180" to="0 1030 180" dur="20s" repeatCount="indefinite"/></circle>
</g>
<!-- playful geometric markers -->
<g>
  <path d="M285 75l18 32h-36z" fill="#f59e0b"><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="3.4s" repeatCount="indefinite"/></path>
  <rect x="905" y="74" width="24" height="24" rx="4" fill="#22c55e" transform="rotate(18 917 86)"><animateTransform attributeName="transform" type="rotate" values="18 917 86;198 917 86;18 917 86" dur="10s" repeatCount="indefinite"/></rect>
  <circle cx="315" cy="278" r="7" fill="#2563eb"><animate attributeName="r" values="5;10;5" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="880" cy="276" r="6" fill="#f59e0b"><animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/></circle>
</g>
<!-- center title -->
<text x="600" y="158" text-anchor="middle" fill="url(#name)" font-family="Arial,Helvetica,sans-serif" font-size="82" font-weight="900" letter-spacing="-3">Saket Jindal</text>
<rect x="425" y="183" width="350" height="5" rx="2.5" fill="#2563eb"/>
<rect x="425" y="183" width="350" height="5" rx="2.5" fill="#22c55e">
  <animate attributeName="width" values="70;350;70" dur="5s" repeatCount="indefinite"/>
</rect>
<text x="600" y="232" text-anchor="middle" fill="#d5e2f2" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" letter-spacing="2.5">AI SECURITY  •  MACHINE LEARNING  •  SOFTWARE</text>
<text x="600" y="274" text-anchor="middle" fill="#9fb4cf" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="1.1">PROJECTS  /  RESEARCH  /  ENGINEERING</text>
<!-- scan line -->
<rect x="90" y="0" width="3" height="360" fill="#22c55e" opacity=".7"><animate attributeName="x" values="90;1110;90" dur="12s" repeatCount="indefinite"/></rect>
</g></svg>