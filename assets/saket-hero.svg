<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Saket Jindal</title>
<desc id="desc">A clean, understated slate and blue profile banner with subtle animated gradient lighting.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111820"/><stop offset=".55" stop-color="#172331"/><stop offset="1" stop-color="#202735"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#4b83b8" stop-opacity=".25"/><stop offset="1" stop-color="#4b83b8" stop-opacity="0"/></radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7da6cf"/><stop offset="1" stop-color="#9a9fc8"/></linearGradient>
  <pattern id="texture" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d9e5f2" stroke-opacity=".035"/></pattern>
  <clipPath id="clip"><rect width="1200" height="300" rx="14"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="300" fill="url(#background)"/>
  <rect width="1200" height="300" fill="url(#texture)"/>
  <ellipse cx="990" cy="135" rx="390" ry="250" fill="url(#light)"><animate attributeName="cx" values="990;850;990" dur="32s" repeatCount="indefinite"/></ellipse>
  <path d="M820 -20L1080 320M910 -20L1170 320" stroke="#b7c9dc" stroke-opacity=".07" stroke-width="1"/>
  <rect x="76" y="61" width="3" height="178" rx="1.5" fill="url(#accent)"/>
  <text x="108" y="139" fill="#f3f5f8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="59" font-weight="650" letter-spacing="-1.9">Saket Jindal</text>
  <text x="111" y="183" fill="#bdcbd9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="2">AI SECURITY  ·  MACHINE LEARNING  ·  SOFTWARE ENGINEERING</text>
  <path d="M111 211H310" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
  <text x="111" y="244" fill="#91a2b4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Selected projects, research and engineering work</text>
  <circle cx="1080" cy="150" r="82" fill="none" stroke="#9eb6cf" stroke-opacity=".11"/>
  <circle cx="1080" cy="150" r="58" fill="none" stroke="#9eb6cf" stroke-opacity=".09"/>
  <circle cx="1080" cy="150" r="3" fill="#a9c4df" opacity=".55"><animate attributeName="opacity" values=".25;.7;.25" dur="6s" repeatCount="indefinite"/></circle>
</g>
</svg>